<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cetak Kartu Santri & Tutor - PKBM Pelita Aushaf Indonesia</title>
  <link rel="icon" type="image/png" href="logo-pkbm.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --green: #0a5c48;
      --green-light: #0d7a5f;
      --gold: #eab308;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef8f4;
      color: var(--text);
    }
    .toolbar {
      max-width: 1020px; margin: 20px auto; background: #fff; padding: 18px 22px;
      border-radius: 20px; border: 1.5px solid #cbd5e1; display: flex;
      justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .toolbar select, .toolbar button, .toolbar a {
      padding: 10px 15px; border-radius: 12px; font-weight: 800; font-size: 13px;
      border: 1.5px solid #cbd5e1; text-decoration: none; cursor: pointer;
    }
    .btn-print-one { background: var(--green); color: #fff; border-color: var(--green) !important; }
    .btn-print-one:hover { background: #074435; }
    .btn-print-all { background: #1d4ed8; color: #fff; border-color: #1d4ed8 !important; }
    .btn-print-all:hover { background: #1e40af; }
    .btn-back { background: #fff; color: var(--green); }

    /* CONTAINER PASANGAN KARTU (DEPAN & BELAKANG) */
    .cards-wrapper {
      max-width: 1020px; margin: 20px auto; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 26px;
    }

    .card-pair {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .id-card {
      width: 460px;
      height: 292px;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(10, 92, 72, 0.14);
      border: 1.5px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* HEADER DEPAN: LOGO & TULISAN DI TENGAH */
    .card-header-center {
      background: var(--green);
      color: #ffffff;
      padding: 10px 14px;
      border-bottom: 3.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .card-header-center img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      background: #fff;
      border-radius: 50%;
      padding: 2px;
      flex-shrink: 0;
    }
    .card-header-center .header-text h2 {
      margin: 0;
      font-size: 15.5px;
      letter-spacing: 0.4px;
      font-weight: 900;
      line-height: 1.15;
    }
    .card-header-center .header-text p {
      margin: 2px 0 0;
      font-size: 9.5px;
      letter-spacing: 0.6px;
      color: #d1fae5;
      font-weight: 700;
    }

    /* BODY DEPAN */
    .card-body {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      flex-grow: 1;
    }
    .photo-box {
      width: 102px;
      height: 132px;
      border-radius: 14px;
      border: 2.5px solid var(--green);
      overflow: hidden;
      background: #bae6fd;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bio-box {
      flex-grow: 1;
      min-width: 0;
    }
    .bio-nama {
      margin: 0 0 8px;
      font-size: 17.5px;
      font-weight: 900;
      color: var(--green);
      line-height: 1.2;
      word-wrap: break-word;
    }
    .bio-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .bio-table td {
      padding: 2.5px 0;
      vertical-align: top;
    }
    .bio-label {
      width: 82px;
      color: var(--muted);
      font-weight: 700;
    }
    .bio-val {
      font-weight: 800;
      color: #0f172a;
    }
    .val-aktif {
      color: #059669;
    }

    /* FOOTER DEPAN */
    .card-footer {
      padding: 7px 18px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }
    .badge-kartu {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }
    .footer-loc {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    /* SISI BELAKANG KARTU (QR CODE & ALAMAT SEKRETARIAT) */
    .back-header {
      text-align: center;
      padding: 12px 16px 8px;
      border-bottom: 1.5px solid #cbd5e1;
      margin: 0 16px;
    }
    .back-header h3 {
      margin: 0;
      font-size: 14px;
      color: var(--green);
      font-weight: 900;
      letter-spacing: 0.4px;
    }
    .back-body {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      flex-grow: 1;
    }
    .qr-frame {
      padding: 7px;
      border: 2.5px solid #10b981;
      border-radius: 14px;
      background: #fff;
      flex-shrink: 0;
    }
    .rules-list {
      margin: 0;
      padding-left: 16px;
      font-size: 11.2px;
      color: #334155;
      line-height: 1.48;
    }
    .rules-list li { margin-bottom: 3px; }

    .back-footer {
      border-top: 1px dashed #cbd5e1;
      margin: 0 16px;
      padding: 7px 4px 10px;
      text-align: center;
      font-size: 10.2px;
      color: #475569;
      line-height: 1.35;
    }
    .back-footer b { color: var(--green); }

    /* PENGATURAN CETAK KERTAS A4 / PDF (PAS 1 HALAMAN UNTUK SATU-SATU & RAPI UNTUK MASSAL) */
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    @media print {
      body { background: #fff !important; }
      .no-print { display: none !important; }
      .cards-wrapper {
        margin: 0;
        padding: 0;
        max-width: 100%;
        gap: 5mm;
      }
      .card-pair {
        gap: 6mm;
        flex-wrap: nowrap;
        width: 100%;
        justify-content: center;
        margin-bottom: 3mm;
      }
      .id-card {
        width: 85.6mm;
        height: 54mm;
        border-radius: 10px;
        box-shadow: none;
        border: 1px solid #94a3b8;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .card-header-center { padding: 5px 8px; border-bottom-width: 2.5px; }
      .card-header-center img { width: 26px; height: 26px; }
      .card-header-center .header-text h2 { font-size: 11px; }
      .card-header-center .header-text p { font-size: 7px; }
      .card-body { padding: 6px 10px; gap: 9px; }
      .photo-box { width: 70px; height: 92px; border-radius: 9px; border-width: 2px; }
      .bio-nama { font-size: 12.5px; margin-bottom: 3px; }
      .bio-table { font-size: 9px; }
      .bio-table td { padding: 1.5px 0; }
      .bio-label { width: 58px; }
      .card-footer { padding: 4px 10px; }
      .badge-kartu { font-size: 7.8px; padding: 2px 8px; }
      .footer-loc { font-size: 8px; }
      .back-header { padding: 7px 8px 4px; margin: 0 10px; }
      .back-header h3 { font-size: 10px; }
      .back-body { padding: 5px 10px; gap: 9px; }
      .qr-frame { padding: 4px; border-width: 2px; border-radius: 9px; }
      .qr-frame img, .qr-frame canvas { width: 74px !important; height: 74px !important; }
      .rules-list { font-size: 8.2px; padding-left: 13px; line-height: 1.38; }
      .rules-list li { margin-bottom: 2px; }
      .back-footer { font-size: 7.4px; margin: 0 10px; padding: 4px 2px 5px; line-height: 1.25; }
    }
  </style>
</head>
<body>

  <div class="toolbar no-print">
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <a href="admin.html" class="btn-back">← Kembali</a>
      <select id="jenisKartu" onchange="muatDaftarPengguna()">
        <option value="santri">🎓 Kartu Tanda Santri</option>
        <option value="tutor">👨‍🏫 Kartu Tanda Tutor / SDM</option>
      </select>
      <select id="selectPengguna" onchange="tampilkanSatuKartu()">
        <option value="">⏳ Memuat data...</option>
      </select>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-print-one" onclick="cetakSatuKartu()">🖨️ Cetak Satu-Satu (1 Halaman)</button>
      <button class="btn-print-all" onclick="cetakSemuaKartu()">📚 Cetak Semua Kartu (<span id="jumlahTotalBadge">0</span>)</button>
    </div>
  </div>

  <!-- AREA RENDER KARTU -->
  <div class="cards-wrapper" id="cardsWrapper"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzS-yWhEgo1N76pIwPOvonXIyqHCQiOp6v36jjOn4otbE7KpQPIIg84kaIsbM87Wrkh/exec";

    let listData = [];

    function konversiFotoDrive(url) {
      if (!url) return "logo-pkbm.png";
      const str = String(url).trim();
      const match = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=s400`;
      }
      return str;
    }

    async function muatDaftarPengguna() {
      const jenis = document.getElementById("jenisKartu").value;
      const sel = document.getElementById("selectPengguna");
      sel.innerHTML = '<option value="">⏳ Mengambil data...</option>';

      const action = (jenis === "santri") ? "get_all_santri" : "get_all_tutor";
      try {
        const res = await fetch(`${API_URL}?action=${action}`);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          listData = json.data;
          document.getElementById("jumlahTotalBadge").textContent = listData.length;
          sel.innerHTML = listData.map((item, idx) => {
            const idVal = jenis === "santri" ? item.nis : item.nip;
            return `<option value="${idx}">${item.nama} (${idVal})</option>`;
          }).join("");
          tampilkanSatuKartu();
        } else {
          listData = [];
          document.getElementById("jumlahTotalBadge").textContent = "0";
          sel.innerHTML = '<option value="">Data kosong</option>';
          document.getElementById("cardsWrapper").innerHTML = "";
        }
      } catch (e) {
        sel.innerHTML = '<option value="">Gagal memuat data</option>';
      }
    }

    function buatElemenPasanganKartu(item, jenis, uniqueIdx) {
      const fotoUrl = konversiFotoDrive(item.foto);
      const qrId = `qr_box_${uniqueIdx}_${Date.now()}`;
      let qrText = "";
      let badgeKartu = "";
      let roleText = "";
      let bioRowsHtml = "";

      if (jenis === "santri") {
        qrText = item.nis;
        badgeKartu = "KARTU TANDA SANTRI";
        roleText = "santri";
        bioRowsHtml = `
          <tr><td class="bio-label">User / NIS</td><td class="bio-val">: ${item.nis}</td></tr>
          <tr><td class="bio-label">Program</td><td class="bio-val">: ${item.jenjang || "-"}</td></tr>
          <tr><td class="bio-label">Tingkat</td><td class="bio-val">: ${item.kelas || "-"}</td></tr>
          <tr><td class="bio-label">Status</td><td class="bio-val val-aktif">: Terdaftar Aktif</td></tr>
        `;
      } else {
        qrText = item.nip;
        badgeKartu = "KARTU TANDA TUTOR / SDM";
        roleText = "tutor / fasilitator";
        bioRowsHtml = `
          <tr><td class="bio-label">NIP / User</td><td class="bio-val">: ${item.nip}</td></tr>
          <tr><td class="bio-label">Jabatan</td><td class="bio-val">: ${item.role || "Tutor"}</td></tr>
          <tr><td class="bio-label">Lembaga</td><td class="bio-val">: PKBM Pelita Aushaf</td></tr>
          <tr><td class="bio-label">Status</td><td class="bio-val val-aktif">: Aktif Bertugas</td></tr>
        `;
      }

      const pairDiv = document.createElement("div");
      pairDiv.className = "card-pair";
      pairDiv.innerHTML = `
        <!-- SISI DEPAN -->
        <div class="id-card">
          <div class="card-header-center">
            <img src="logo-pkbm.png" alt="Logo PKBM">
            <div class="header-text">
              <h2>PKBM PELITA AUSHAF INDONESIA</h2>
              <p>HOMESCHOOLING & PENDIDIKAN KESETARAAN</p>
            </div>
          </div>
          <div class="card-body">
            <div class="photo-box">
              <img src="${fotoUrl}" alt="Foto" onerror="this.src='logo-pkbm.png'">
            </div>
            <div class="bio-box">
              <h3 class="bio-nama">${item.nama || "-"}</h3>
              <table class="bio-table">${bioRowsHtml}</table>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge-kartu">${badgeKartu}</span>
            <span class="footer-loc">Sidoarjo, Jawa Timur</span>
          </div>
        </div>

        <!-- SISI BELAKANG -->
        <div class="id-card">
          <div class="back-header">
            <h3>KARTU ABSENSI RESMI PKBM PELITA AUSHAF</h3>
          </div>
          <div class="back-body">
            <div class="qr-frame">
              <div id="${qrId}"></div>
            </div>
            <ol class="rules-list">
              <li>Kartu tanda pengenal resmi <span>${roleText}</span> PKBM Pelita Aushaf Indonesia.</li>
              <li>Tunjukkan <b>QR Code</b> pada guru saat absensi kelas.</li>
              <li>Dilarang memindahtangankan kartu kepada orang lain.</li>
              <li>Jika menemukan kartu ini, harap hubungi kantor sekretariat.</li>
            </ol>
          </div>
          <div class="back-footer">
            <b>Alamat Sekretariat:</b> Perumahan Griya Permata Gedangan Blok G2 / 29, Gedangan, Sidoarjo<br>
            <b>No. Telp / WA:</b> 087751325199 • Website: pkbmpelitaaushafindonesia.sch.id
          </div>
        </div>
      `;

      return { element: pairDiv, qrId: qrId, qrText: String(qrText).trim() };
    }

    function tampilkanSatuKartu() {
      const jenis = document.getElementById("jenisKartu").value;
      const idx = document.getElementById("selectPengguna").value;
      const item = listData[idx];
      const wrapper = document.getElementById("cardsWrapper");
      wrapper.innerHTML = "";
      if (!item) return;

      const built = buatElemenPasanganKartu(item, jenis, idx);
      wrapper.appendChild(built.element);

      new QRCode(document.getElementById(built.qrId), {
        text: built.qrText,
        width: 112,
        height: 112,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function cetakSatuKartu() {
      tampilkanSatuKartu();
      setTimeout(() => { window.print(); }, 250);
    }

    function cetakSemuaKartu() {
      if (!listData.length) return;
      const jenis = document.getElementById("jenisKartu").value;
      const wrapper = document.getElementById("cardsWrapper");
      wrapper.innerHTML = "";

      listData.forEach((item, idx) => {
        const built = buatElemenPasanganKartu(item, jenis, idx);
        wrapper.appendChild(built.element);

        new QRCode(document.getElementById(built.qrId), {
          text: built.qrText,
          width: 112,
          height: 112,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });

      // Beri jeda sejenak agar seluruh gambar foto & QR Code selesai dirender sebelum dialog print/PDF terbuka
      setTimeout(() => { window.print(); }, 500);
    }

    const savedSiswa = localStorage.getItem("siswaAuth");
    muatDaftarPengguna().then(() => {
      if (savedSiswa) {
        try {
          const s = JSON.parse(savedSiswa);
          const foundIdx = listData.findIndex(x => String(x.nis).toLowerCase() === String(s.nis).toLowerCase());
          if (foundIdx >= 0) {
            document.getElementById("selectPengguna").value = foundIdx;
            tampilkanSatuKartu();
          }
        } catch(e) {}
      }
    });
  </script>
</body>
</html>
