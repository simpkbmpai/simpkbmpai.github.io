<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cetak Kartu Tanda Santri & Tutor - PKBM Pelita Aushaf</title>
  <link rel="icon" type="image/png" href="logo-pkbm.png" />

  <style>
    :root {
      --green: #0d7a5f;
      --green-dark: #074e3d;
      --green-soft: #eef8f4;
      --line: #d6eee5;
      --text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0fdf4;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .no-print {
      width: 100%;
      max-width: 920px;
      background: #fff;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
      border: 0;
    }
    .btn-print { background: var(--green); color: #fff; box-shadow: 0 6px 18px rgba(13,122,95,0.25); }
    .btn-back { background: #fff; color: var(--green-dark); border: 1.5px solid var(--line); }
    select { padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--line); outline: none; font-size: 13px; font-weight: bold; }

    /* WADAH KARTU ATM (85.6mm x 54mm) */
    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .pair-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      page-break-inside: avoid;
    }

    .id-card {
      width: 85.6mm;
      height: 54mm;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
      border: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* FRONT */
    .card-front { background: linear-gradient(145deg, #ffffff 60%, #e6f7f0); }
    .front-header {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #fbbf24;
    }
    .front-header img { width: 30px; height: 30px; border-radius: 50%; background: #fff; padding: 2px; }
    .header-text h3 { margin: 0; font-size: 9.5pt; font-weight: 900; line-height: 1.1; }
    .header-text p { margin: 0; font-size: 5.5pt; color: #d1fae5; text-transform: uppercase; }

    .front-body { display: flex; padding: 7px 10px 4px; gap: 10px; align-items: center; flex: 1; }
    .photo-frame {
      width: 25mm; height: 32mm; border-radius: 8px; border: 2px solid var(--green);
      overflow: hidden; background: #e5e7eb; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

    .info-table { font-size: 6.5pt; line-height: 1.35; color: #1f2937; flex: 1; }
    .info-table b.nama { font-size: 8.5pt; color: var(--green-dark); display: block; margin-bottom: 3px; line-height: 1.15; }
    .info-row { display: grid; grid-template-columns: 24mm 1fr; margin-bottom: 2px; }
    .info-label { color: #6b7280; font-weight: 600; }
    .info-val { font-weight: 800; color: #111827; }

    .front-footer {
      background: #f8fafc; padding: 3px 10px; display: flex; justify-content: space-between;
      align-items: center; border-top: 1px solid #e5e7eb; font-size: 5.5pt; color: #64748b; font-weight: bold;
    }
    .badge-card-type {
      background: #fef3c7; color: #92400e; padding: 1.5px 6px; border-radius: 999px; font-size: 5.5pt; font-weight: 900; border: 1px solid #fde68a;
    }

    /* BACK */
    .card-back { background: #ffffff; padding: 8px 10px; text-align: center; }
    .back-title {
      font-size: 7pt; font-weight: 900; color: var(--green-dark); text-transform: uppercase;
      border-bottom: 1.5px solid var(--line); padding-bottom: 3px; margin-bottom: 6px;
    }
    .back-content { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
    .qr-box {
      width: 25mm; height: 25mm; border: 1.5px solid #10b981; border-radius: 8px; padding: 2px; background: #fff; flex-shrink: 0;
    }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    .rules-list { font-size: 5.2pt; color: #374151; line-height: 1.35; padding-left: 12px; margin: 0; }
    .rules-list li { margin-bottom: 2px; }
    .back-footer {
      margin-top: 6px; border-top: 1px dashed #cbd5e1; padding-top: 4px; font-size: 4.8pt; color: #64748b; line-height: 1.25; text-align: center;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .cards-wrapper { gap: 10mm; }
      .pair-container { gap: 10mm; margin-bottom: 10mm; }
      .id-card { box-shadow: none; border: 1px solid #9ca3af; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <a href="admin.html" class="btn btn-back">← Dashboard Admin</a>
    <div style="display:flex; gap:10px; align-items:center;">
      <select id="selectKategori">
        <option value="santri">🎓 Cetak Kartu Santri</option>
        <option value="tutor">👨‍🏫 Cetak Kartu Tutor / Guru</option>
      </select>
      <select id="selectOrang">
        <option value="all">-- Cetak Semua Sekaligus --</option>
      </select>
    </div>
    <button onclick="window.print()" class="btn btn-print">🖨️ Cetak Kartu (PDF)</button>
  </div>

  <div class="cards-wrapper" id="cardsContainer">
    <div style="padding:40px; text-align:center; color:var(--text);" id="loadingText">⏳ Memuat data kartu dari database...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzS-yWhEgo1N76pIwPOvonXIyqHCQiOp6v36jjOn4otbE7KpQPIIg84kaIsbM87Wrkh/exec";
    
    let listSantri = [];
    let listTutor = [];
    let activeCategory = "santri";

    // FUNGSI KONVERSI LINK GOOGLE DRIVE JADI DIRECT IMAGE URL
    function formatDrivePhoto(url) {
      if (!url || typeof url !== "string" || url.trim().length < 10) {
        return "logo-pkbm.png"; // Cadangan jika belum upload foto
      }
      url = url.trim();
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;
      }
      return url;
    }

    async function loadAllData() {
      try {
        const [resS, resT] = await Promise.all([
          fetch(`${API_URL}?action=get_all_santri`),
          fetch(`${API_URL}?action=get_all_tutor`)
        ]);
        const jsonS = await resS.json();
        const jsonT = await resT.json();

        if (jsonS.success) listSantri = jsonS.data;
        if (jsonT.success) listTutor = jsonT.data;

        renderDropdownOrang();
        renderCards();
      } catch (err) {
        document.getElementById("loadingText").textContent = "Gagal memuat data: " + err.message;
      }
    }

    function renderDropdownOrang() {
      const sel = document.getElementById("selectOrang");
      sel.innerHTML = '<option value="all">-- Cetak Semua Sekaligus --</option>';

      if (activeCategory === "santri") {
        listSantri.forEach((s, idx) => {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = `${s.nis} - ${s.nama} (${s.kelas})`;
          sel.appendChild(opt);
        });
      } else {
        listTutor.forEach((t, idx) => {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = `${t.nip} - ${t.nama} (${t.role})`;
          sel.appendChild(opt);
        });
      }
    }

    document.getElementById("selectKategori").addEventListener("change", (e) => {
      activeCategory = e.target.value;
      renderDropdownOrang();
      renderCards();
    });

    document.getElementById("selectOrang").addEventListener("change", () => {
      renderCards();
    });

    function renderCards() {
      const container = document.getElementById("cardsContainer");
      container.innerHTML = "";
      const selectedIdx = document.getElementById("selectOrang").value;

      if (activeCategory === "santri") {
        const dataArr = selectedIdx === "all" ? listSantri : [listSantri[selectedIdx]];
        if (dataArr.length === 0 || !dataArr[0]) {
          container.innerHTML = '<div style="padding:40px; text-align:center;">Tidak ada data santri.</div>';
          return;
        }

        dataArr.forEach(s => {
          const fotoImg = formatDrivePhoto(s.foto);
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(s.nis)}&margin=2`;
          
          let jenjangText = s.jenjang || "Paket A";
          if (jenjangText.toUpperCase().includes("PAT") || jenjangText.toUpperCase().includes("PDPD")) {
            jenjangText = "Program Kesetaraan";
          }

          container.innerHTML += `
            <div class="pair-container">
              <!-- FRONT SANTRI -->
              <div class="id-card card-front">
                <div class="front-header">
                  <img src="logo-pkbm.png" alt="Logo">
                  <div class="header-text">
                    <h3>PKBM PELITA AUSHAF</h3>
                    <p>Homeschooling & Pendidikan Kesetaraan</p>
                  </div>
                </div>
                <div class="front-body">
                  <div class="photo-frame">
                    <img src="${fotoImg}" alt="Foto Santri" onerror="this.src='logo-pkbm.png'">
                  </div>
                  <div class="info-table">
                    <b class="nama">${s.nama}</b>
                    <div class="info-row"><span class="info-label">NIS</span><span class="info-val">: ${s.nis}</span></div>
                    <div class="info-row"><span class="info-label">Program</span><span class="info-val">: ${jenjangText}</span></div>
                    <div class="info-row"><span class="info-label">Tingkat</span><span class="info-val">: ${s.kelas}</span></div>
                    <div class="info-row"><span class="info-label">Status</span><span class="info-val" style="color:#059669;">: Terdaftar Aktif</span></div>
                  </div>
                </div>
                <div class="front-footer">
                  <span class="badge-card-type">KARTU TANDA SANTRI</span>
                  <span>Sidoarjo, Jawa Timur</span>
                </div>
              </div>

              <!-- BACK SANTRI -->
              <div class="id-card card-back">
                <div class="back-title">KARTU ABSENSI RESMI PKBM PELITA AUSHAF</div>
                <div class="back-content">
                  <div class="qr-box">
                    <img src="${qrUrl}" alt="QR Code">
                  </div>
                  <ol class="rules-list">
                    <li>Kartu tanda pengenal resmi santri PKBM Pelita Aushaf.</li>
                    <li>Tunjukkan <b>QR Code</b> pada guru saat absensi kelas.</li>
                    <li>Dilarang memindahtangankan kartu kepada orang lain.</li>
                    <li>Jika menemukan kartu ini, harap hubungi kantor sekolah.</li>
                  </ol>
                </div>
                <div class="back-footer">
                  <b>Kampus I:</b> Gedung G2 • <b>Kampus II:</b> Gedung I5<br>
                  Website: pkbmpelitaaushafindonesia.sch.id
                </div>
              </div>
            </div>
          `;
        });

      } else {
        // KARTU TUTOR
        const dataArr = selectedIdx === "all" ? listTutor : [listTutor[selectedIdx]];
        if (dataArr.length === 0 || !dataArr[0]) {
          container.innerHTML = '<div style="padding:40px; text-align:center;">Tidak ada data tutor.</div>';
          return;
        }

        dataArr.forEach(t => {
          const fotoImg = formatDrivePhoto(t.foto);
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(t.nip)}&margin=2`;

          container.innerHTML += `
            <div class="pair-container">
              <!-- FRONT TUTOR -->
              <div class="id-card card-front">
                <div class="front-header" style="background: linear-gradient(135deg, #065f46, #022c22);">
                  <img src="logo-pkbm.png" alt="Logo">
                  <div class="header-text">
                    <h3>PKBM PELITA AUSHAF</h3>
                    <p>Homeschooling & Pendidikan Kesetaraan</p>
                  </div>
                </div>
                <div class="front-body">
                  <div class="photo-frame" style="border-color:#065f46;">
                    <img src="${fotoImg}" alt="Foto Tutor" onerror="this.src='logo-pkbm.png'">
                  </div>
                  <div class="info-table">
                    <b class="nama">${t.nama}</b>
                    <div class="info-row"><span class="info-label">NIP / User</span><span class="info-val">: ${t.nip}</span></div>
                    <div class="info-row"><span class="info-label">Jabatan</span><span class="info-val">: ${t.role}</span></div>
                    <div class="info-row"><span class="info-label">Divisi</span><span class="info-val">: Akademik PKBM</span></div>
                    <div class="info-row"><span class="info-label">Status</span><span class="info-val" style="color:#059669;">: Pengajar Aktif</span></div>
                  </div>
                </div>
                <div class="front-footer">
                  <span class="badge-card-type" style="background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">KARTU TANDA TUTOR</span>
                  <span>Sidoarjo, Jawa Timur</span>
                </div>
              </div>

              <!-- BACK TUTOR -->
              <div class="id-card card-back">
                <div class="back-title">KARTU IDENTITAS RESMI TENAGA PENDIDIK</div>
                <div class="back-content">
                  <div class="qr-box" style="border-color:#065f46;">
                    <img src="${qrUrl}" alt="QR Code">
                  </div>
                  <ol class="rules-list">
                    <li>Kartu resmi tenaga pendidik & fasilitator PKBM Pelita Aushaf.</li>
                    <li>Gunakan untuk verifikasi kehadiran dan administrasi kelas.</li>
                    <li>Dilarang memindahtangankan kartu kepada pihak lain.</li>
                    <li>Jika menemukan kartu ini, harap hubungi kantor yayasan.</li>
                  </ol>
                </div>
                <div class="back-footer">
                  <b>Kampus I:</b> Gedung G2 • <b>Kampus II:</b> Gedung I5<br>
                  Website: pkbmpelitaaushafindonesia.sch.id
                </div>
              </div>
            </div>
          `;
        });
      }
    }

    loadAllData();
  </script>
</body>
</html>
