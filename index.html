<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PKBM Pelita Aushaf Indonesia - Daycare, PAUD (Kelompok Bermain), Homeschooling, Paket A B C & Inklusi</title>
  <meta name="description" content="Web profil dan pendaftaran murid baru PKBM Pelita Aushaf Indonesia. Layanan Daycare, PAUD Non Formal (Kelompok Bermain), Homeschooling, Kesetaraan Paket A B C, dan Pendidikan Inklusi di Sidoarjo." />
  <link rel="icon" type="image/png" href="logo-pkbm.png" />
  <style>
    :root{
      --green:#0d7a5f;
      --green-dark:#0a5c48;
      --green-soft:#eef8f4;
      --line:#d6eee5;
      --text:#1f2937;
      --muted:#6b7280;
      --gold:#d6aa38;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#f5fbf8,#ffffff 30%,#f8fcfa);
      line-height:1.6;
    }
    img{max-width:100%;display:block}
    a{text-decoration:none;color:inherit}
    .container{max-width:1280px;margin:auto;padding:0 20px}
    
    /* Header & Navigation */
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(255,255,255,.98);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }
    .brand-logo{
      width:50px;height:50px;border-radius:50%;background:white;padding:2px;object-fit:contain;
      box-shadow:0 6px 16px rgba(13,122,95,.10);border:1px solid #edf5f2;flex:0 0 auto;
    }
    .brand-title{margin:0;font-size:16px;line-height:1.2;color:var(--green-dark);font-weight:800;white-space:nowrap}
    .brand-sub{margin:2px 0 0;color:var(--muted);font-size:11.5px;white-space:nowrap}
    
    .nav-menu-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:1;
    }
    nav ul{
      list-style:none;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0;
      margin:0;
      color:#374151;
      font-weight:700;
      font-size:13px;
    }
    nav a{white-space:nowrap;transition:color .2s}
    nav a:hover{color:var(--green)}
    
    .nav-portal-btn{
      display:inline-flex;
      align-items:center;
      gap:5px;
      background:var(--green-soft);
      color:var(--green-dark) !important;
      border:1.5px solid #bce6d7;
      padding:6px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:12.5px;
      white-space:nowrap;
      transition:all .2s ease;
    }
    .nav-portal-btn:hover{
      background:var(--green);
      color:#fff !important;
      border-color:var(--green);
      box-shadow:0 4px 12px rgba(13,122,95,.2);
      transform:translateY(-1px);
    }
    
    .nav-elearning-btn{
      display:inline-flex;
      align-items:center;
      gap:5px;
      background:#0d7a5f;
      color:#fff !important;
      border:1.5px solid #0d7a5f;
      padding:6px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:12.5px;
      white-space:nowrap;
      transition:all .2s ease;
      box-shadow:0 4px 12px rgba(13,122,95,.18);
    }
    .nav-elearning-btn:hover{
      background:#0a5c48;
      border-color:#0a5c48;
      transform:translateY(-1px);
    }
    
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      background:var(--green);color:#fff;border:0;border-radius:999px;
      padding:8px 16px;font-weight:800;cursor:pointer;font-size:13px;
      box-shadow:0 6px 16px rgba(13,122,95,.18);
      white-space:nowrap;
      transition:all .2s ease;
      flex-shrink:0;
    }
    .btn:hover{background:var(--green-dark);transform:translateY(-1px)}
    .btn-outline{background:#fff;color:var(--green-dark);border:1.5px solid var(--line);box-shadow:none}
    .btn-outline:hover{background:var(--green-soft);border-color:#bce6d7}
    
    /* Hero Banner */
    .hero{
      padding:54px 0 50px;
      background:linear-gradient(180deg,#eef8f4,#f8fcfa 100%);
      border-bottom:1px solid #edf5f2;
    }
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}
    .badge{
      display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
      background:#fff;border:1px solid var(--line);color:var(--green);font-weight:800;font-size:13.5px;
      box-shadow:0 8px 20px rgba(13,122,95,.08);
    }
    h1{margin:18px 0 16px;font-size:50px;line-height:1.1;letter-spacing:-1.2px;color:#0f172a}
    .lead{font-size:17.5px;color:#4b5563;max-width:760px}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
    .hero-actions .btn{padding:13px 22px;font-size:14.5px;border-radius:16px}
    
    .hero-card{
      background:#fff;border:1px solid #e8f4ef;border-radius:32px;padding:24px;
      box-shadow:0 28px 70px rgba(13,122,95,.12);
    }
    .hero-card-inner{border-radius:28px;padding:20px;background:linear-gradient(145deg,#dff4e9,#eef8f4)}
    .top-mini-brand{
      display:flex;align-items:center;gap:12px;margin-bottom:16px;background:#ffffffc9;
      border-radius:20px;padding:12px;border:1px solid #e6f3ed;
    }
    .top-mini-brand img{width:56px;height:56px;border-radius:50%;object-fit:contain;background:#fff;padding:3px;border:1px solid #eef4f0}
    .top-mini-brand b{display:block;color:var(--green-dark);font-size:16px}
    .top-mini-brand span{display:block;font-size:13px;color:#6b7280}
    .people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .person{background:rgba(255,255,255,.78);border:1px solid #ecf5f1;border-radius:24px;padding:16px;text-align:center}
    .head{width:60px;height:60px;border-radius:50%;background:#b6e8cb;margin:0 auto 8px}
    .body{width:48px;height:74px;border-radius:20px 20px 14px 14px;background:#72d6ae;margin:0 auto}
    .person small{display:block;margin-top:10px;font-weight:800;color:#0a5c48;font-size:14px}
    .motto{margin-top:16px;padding:18px;border-radius:24px;background:#fff;text-align:center;border:1px solid #ebf4f0}
    .motto b{color:#0a5c48;font-size:19px}
    .motto p{margin:6px 0 0;color:#4b5563}
    section{padding:64px 0}
    .section-title{text-align:center;max-width:720px;margin:0 auto 34px}
    .eyebrow{display:block;color:var(--green);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:800;margin-bottom:8px}
    h2{font-size:38px;line-height:1.18;margin:0 0 14px;color:#0f172a}
    .section-title p{color:#6b7280;margin:0}
    .grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{
      background:#fff;border:1px solid #e7f4ee;border-radius:28px;padding:26px;
      box-shadow:0 12px 36px rgba(13,122,95,.07);
    }
    .checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
    .check{background:#f3fbf7;border:1px solid #e4f4ed;border-radius:16px;padding:12px 14px;display:flex;gap:10px;font-size:14px}
    .check:before{content:"✓";color:var(--green);font-weight:900}
    .icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#dbf2e6;font-size:24px;margin-bottom:14px}
    .card h3{margin:0 0 10px;font-size:22px;color:#0f172a}
    .card p{margin:0;color:#5b6472}
    .program-card{display:flex;flex-direction:column;gap:10px}
    .program-card .mini-link{
      margin-top:auto;display:inline-flex;align-items:center;justify-content:center;
      border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--green-dark);
      font-weight:700;background:#f8fcfa;
    }
    .program-card .mini-link:hover{background:#eef8f4}

    .gallery-toolbar{
      margin:20px 0 28px;
      display:grid;
      gap:16px;
    }
    .gallery-tabs{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
    }
    .tab-btn{
      border:1px solid var(--line);
      background:#fff;
      color:#345047;
      font-weight:800;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:.2s ease;
      box-shadow:0 8px 20px rgba(13,122,95,.04);
    }
    .tab-btn:hover{
      transform:translateY(-1px);
      background:#f3fbf7;
    }
    .tab-btn.active{
      background:var(--green);
      color:#fff;
      border-color:var(--green);
      box-shadow:0 12px 28px rgba(13,122,95,.18);
    }
    .tab-count{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:24px;
      height:24px;
      margin-left:8px;
      padding:0 7px;
      border-radius:999px;
      background:#eef8f4;
      color:var(--green-dark);
      font-size:12px;
      font-weight:900;
    }
    .tab-btn.active .tab-count{
      background:rgba(255,255,255,.2);
      color:#fff;
    }
    .gallery-summary{
      text-align:center;
      color:#5b6472;
      font-size:14px;
      background:#fff;
      border:1px solid #e7f4ee;
      border-radius:18px;
      padding:12px 16px;
      max-width:760px;
      margin:0 auto;
    }
    .gallery-masonry{
      column-count:3;
      column-gap:18px;
    }
    .photo-card{
      display:inline-block;
      width:100%;
      margin:0 0 18px;
      background:#fff;
      border:1px solid #e7f4ee;
      border-radius:26px;
      overflow:hidden;
      box-shadow:0 12px 36px rgba(13,122,95,.07);
      break-inside:avoid;
      transition:.2s ease;
    }
    .photo-card:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 44px rgba(13,122,95,.11);
    }
    .photo-thumb{
      display:block;
      width:100%;
      border:0;
      padding:8px;
      background:#eef8f4;
      cursor:pointer;
    }
    .photo-thumb img{
      width:100%;
      height:auto;
      max-height:430px;
      object-fit:contain;
      background:#eef8f4;
      border-radius:18px;
      margin:auto;
    }
    .photo-body{
      padding:16px 16px 18px;
    }
    .photo-body b{
      display:block;
      color:#0f172a;
      font-size:17px;
      line-height:1.35;
    }
    .photo-body small{
      display:block;
      color:#6b7280;
      margin-top:6px;
    }
    .photo-program{
      display:inline-flex;
      margin-bottom:9px;
      padding:5px 9px;
      border-radius:999px;
      background:#eef8f4;
      color:var(--green-dark);
      font-size:12px;
      font-weight:900;
    }
    .load-more-wrap{
      display:flex;
      justify-content:center;
      margin-top:16px;
    }
    .load-more-btn{
      display:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--green-dark);
      border-radius:16px;
      padding:13px 18px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(13,122,95,.08);
    }
    .load-more-btn:hover{background:#f3fbf7}
    .empty-gallery{
      text-align:center;
      border:2px dashed #cce8dd;
      border-radius:28px;
      padding:34px;
      background:#f8fcfa;
      color:#6b7280;
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:200;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(15,23,42,.82);
      backdrop-filter:blur(6px);
    }
    .lightbox.show{display:flex}
    .lightbox-panel{
      width:min(1120px, 100%);
      max-height:92vh;
      background:#fff;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.35);
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .lightbox-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid #
